# ----------------------------------------------------------------------------------------------------
# Web App Deploy Template using templates
# ----------------------------------------------------------------------------------------------------
name: $(date:yyyy).$(date:MM).$(date:dd)$(rev:.r)

trigger:
- none   
# - master

# ----------------------------------------------------------------------------------------------------
parameters:
- name: runCodeScan
  displayName: Run Code Scan
  type: boolean
  default: true
- name: deployWebApp
  displayName: Deploy Web App
  type: boolean
  default: true
- name: studentIdNumber
  displayName: Student ID Number
  type: number
  default: 999999999

# ----------------------------------------------------------------------------------------------------
stages:
- ${{ if eq(parameters.runCodeScan), true) }}:
  - stage: ScanStage
    jobs:
    - template: ./templates/steps-scan-code-template.yml

# ----------------------------------------------------------------------------------------------------
- stage: BuildStage
  jobs:
  - template: ./templates/steps-scan-code-template.yml

# ----------------------------------------------------------------------------------------------------
- ${{ if eq(parameters.deployWebApp), true) }}:
  - stage: DeployStage
    jobs:
    - template: ./templates/steps-scan-code-template.yml
      parameters:
        serviceConnectionName: 'PUL-Connection'
        appName:  'pul-yaml-$(studentIdNumber)'
